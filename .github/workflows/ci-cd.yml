name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw -q test

  backend-build:
    needs: backend-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build backend artifact
        run: ./mvnw -q -DskipTests package

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker-build:
    needs:
      - backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t translation-agency:${{ github.sha }} .

  docker-smoke:
    needs:
      - backend-build
      - frontend-build
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_SERVER_PORT: ${{ vars.CI_SERVER_PORT }}
      CI_FRONTEND_PORT: ${{ vars.CI_FRONTEND_PORT }}
      CI_POSTGRES_PORT: ${{ vars.CI_POSTGRES_PORT }}
      CI_POSTGRES_DB: ${{ vars.CI_POSTGRES_DB }}
      CI_POSTGRES_USER: ${{ vars.CI_POSTGRES_USER }}
      CI_SPRING_JPA_HIBERNATE_DDL_AUTO: ${{ vars.CI_SPRING_JPA_HIBERNATE_DDL_AUTO }}
      CI_APP_CORS_ALLOWED_ORIGINS: ${{ vars.CI_APP_CORS_ALLOWED_ORIGINS }}
      CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Docker Compose smoke-test env
        run: |
          cat > .env <<EOF
          SERVER_PORT=${CI_SERVER_PORT:-8080}
          FRONTEND_PORT=${CI_FRONTEND_PORT:-5173}
          POSTGRES_PORT=${CI_POSTGRES_PORT:-5432}
          POSTGRES_DB=${CI_POSTGRES_DB:-translation_agency}
          POSTGRES_USER=${CI_POSTGRES_USER:-postgres}
          POSTGRES_PASSWORD_FILE=./secrets/postgres_password.txt
          SPRING_JPA_HIBERNATE_DDL_AUTO=${CI_SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
          APP_CORS_ALLOWED_ORIGINS=${CI_APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
          EOF
          mkdir -p secrets
          printf '%s\n' "${CI_POSTGRES_PASSWORD:-ci-postgres-password}" > secrets/postgres_password.txt

      - name: Start application stack
        run: docker compose up --build -d

      - name: Wait for local healthcheck
        run: |
          for attempt in {1..30}; do
            if curl -fsSL http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Local smoke healthcheck passed."
              exit 0
            fi

            echo "Local healthcheck attempt $attempt failed, retrying in 10 seconds..."
            sleep 10
          done

          echo "Local smoke healthcheck did not become healthy in time."
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop application stack
        if: always()
        run: docker compose down -v

  deploy:
    needs:
      - docker-smoke
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      HEALTHCHECK_URL: ${{ vars.RENDER_HEALTHCHECK_URL }}

    steps:
      - name: Skip deploy when Render secrets are missing
        if: env.DEPLOY_HOOK_URL == ''
        run: echo "Render deploy hook secret is not configured. Skipping deploy job."

      - name: Trigger PaaS deployment
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsSL -X POST "$DEPLOY_HOOK_URL"

      - name: Wait for remote healthcheck
        if: env.DEPLOY_HOOK_URL != ''
        run: |
          TARGET_HEALTHCHECK_URL="${HEALTHCHECK_URL:-https://translation-agency-api.onrender.com/actuator/health}"

          for attempt in {1..30}; do
            if curl -fsSL "$TARGET_HEALTHCHECK_URL" | grep -q '"status":"UP"'; then
              echo "Application is healthy."
              exit 0
            fi

            echo "Healthcheck attempt $attempt failed, retrying in 10 seconds..."
            sleep 10
          done

          echo "Healthcheck did not become healthy in time."
          exit 1
